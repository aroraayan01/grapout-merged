services:
  postgres:
    image: postgres:16-alpine
    container_name: aeo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: aeo_password
      POSTGRES_DB: aeo
    ports:
      - "5432:5432"
    volumes:
      - aeo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aeo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aeo_redisdata:/data

volumes:
  aeo_pgdata:
  aeo_redisdata:
