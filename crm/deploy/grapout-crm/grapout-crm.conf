# GrapOut CRM — this app, served as a folder of grapout.com.
#
# Apache holds the visitor's connection and fetches from the containers on
# localhost, so the address bar stays on grapout.com the whole time. This is a
# proxy, not a redirect: nothing sends the browser to grapme.com.
#
# Install as a cPanel per-domain include (see docs/DEPLOY_GRAPOUT_CRM.md):
#   /etc/apache2/conf.d/userdata/std/2_4/grapme/grapout.com/crm.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/grapme/grapout.com/crm.conf

ProxyPreserveHost On
ProxyRequests Off

# ORDER MATTERS. The API has to be matched before the catch-all /crm rule,
# or Next.js answers /crm/api/* itself and every request 404s.
#
# The API mounts everything under /api/v1 (setGlobalPrefix in main.ts), so
# /crm/api/v1/x maps to :4000/api/v1/x. That also makes the app same-origin
# with its own API, which is why no CORS is involved.
ProxyPass        /crm/api/  http://127.0.0.1:4000/api/
ProxyPassReverse /crm/api/  http://127.0.0.1:4000/api/

# The web app itself. It is BUILT with basePath=/crm, so it expects to be
# addressed with the prefix — hence /crm on both sides of this rule.
ProxyPass        /crm  http://127.0.0.1:3000/crm
ProxyPassReverse /crm  http://127.0.0.1:3000/crm
