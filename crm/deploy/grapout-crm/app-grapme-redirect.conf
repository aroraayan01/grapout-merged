# Old app address → the new one, path intact.
#
#   https://app.grapme.com/dashboard  →  https://www.grapout.com/crm/dashboard
#
# Needed the moment the image is rebuilt: the container then answers only under
# /crm, so every old bookmark is a 404 without this. Unlike the /crm rule on
# grapout.com, this IS a redirect — the browser should end up on the new address
# and remember it.
#
# NOT for api.grapme.com. That one stays a silent proxy to :4000, forever,
# because the tracking links inside already-sent email point at it.
#
# Install as a cPanel per-domain include:
#   /etc/apache2/conf.d/userdata/{std,ssl}/2_4/grapme/app.grapme.com/redirect.conf

RewriteEngine On
RewriteRule ^/?(.*)$ https://www.grapout.com/crm/$1 [R=301,L]
