; Loaded by start-dev.bat through PHP_INI_SCAN_DIR, on top of the system php.ini.
; Compiled PHP is kept in memory by the long-lived API server, so a request
; boots Laravel from cache instead of reading thousands of files each time.
zend_extension=php_opcache.dll
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
